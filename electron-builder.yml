appId: app.madao.desktop
productName: 码到
executableName: MaoDao
copyright: Copyright © 2026 码到
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-16.png
    to: tray-16.png
  - from: resources/tray-32.png
    to: tray-32.png
asar: true
publish:
  provider: github
  owner: Alieforwang
  repo: maodao
win:
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: MaoDao-Setup-${version}-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  include: build/installer.nsh
  shortcutName: 码到
  uninstallDisplayName: 码到
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
